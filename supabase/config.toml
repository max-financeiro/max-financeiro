# Supabase config - Sistema Financeiro Maxfem
# project_id identifica o projeto local pra `supabase start/stop/status`.
# Não confundir com SUPABASE_PROJECT_REF (remote, em .env.local).
project_id = "financeiro-maxfem"

[api]
enabled = true
port = 54321
schemas = ["public", "audit"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
# Domínio real em produção é www.financeiromaxfem.com.br.
# Site URL + Redirect URLs do projeto remoto devem ser configurados no DASHBOARD
# Supabase (Auth → URL Configuration) — config.toml só vale pro stack local.
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://www.financeiromaxfem.com.br/auth/callback",
  "https://financeiromaxfem.com.br/auth/callback"
]
jwt_expiry = 28800  # 8h admin; portal de fornecedor usa refresh shorter via app
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false  # admin convida via UI, fornecedor via portal flow
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[auth.email.template.invite]
subject = "Convite para o Sistema Financeiro Maxfem"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Portal Maxfem"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false  # SMS é vulnerável a SIM swap, ver SECURITY.md §2

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[storage]
enabled = true
file_size_limit = "10MiB"  # XMLs de NF + boletos PDF cabem; ajustar se precisar

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false  # usaremos Sentry + Better Stack
