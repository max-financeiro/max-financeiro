name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Lint + Typecheck (rápido, falha cedo)
  # ============================================================
  lint:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ============================================================
  # Unit tests
  # passWithNoTests: true em vitest.config.ts permite suites vazias
  # ============================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  # ============================================================
  # RLS Test Suite
  # ------------------------------------------------------------
  # Em Sprint 1: roda vitest sobre tests/rls com describes .skip
  # (passWithNoTests: true permite isso).
  #
  # Em Sprint 2+: ativar `supabase start` aqui, provisionar fixtures
  # (orgs + users com roles distintos) via service role no beforeAll,
  # e remover .skip dos describes. Aí passa a ser GATE de merge.
  # ============================================================
  test-rls:
    name: RLS Test Suite (skipped - sprint 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:rls

  # ============================================================
  # Secret scanning — gitleaks CLI direto (OSS, sem licença)
  # gitleaks-action virou pago em 2024 pra orgs; o binário continua MIT.
  # ============================================================
  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --config .gitleaks.toml --no-git --verbose --redact

  # ============================================================
  # Dependency vulnerability scan
  # ============================================================
  audit:
    name: npm audit (vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (high+critical fail)
        run: npm audit --audit-level=high

  # ============================================================
  # Static analysis — semgrep (regras OWASP + segurança)
  # ============================================================
  semgrep:
    name: Static Analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=p/owasp-top-ten --config=p/typescript --config=p/react --config=p/nextjs
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ============================================================
  # Gate final — tudo precisa passar
  # ============================================================
  ci-gate:
    name: CI Gate (all checks)
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-rls, gitleaks, audit, semgrep]
    steps:
      - run: echo "Todos os checks passaram"
