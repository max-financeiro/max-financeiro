name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

# Concurrency: cancela runs anteriores no mesmo PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Lint + Typecheck (rápido, falha cedo)
  # ============================================================
  lint:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ============================================================
  # Unit tests
  # ============================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  # ============================================================
  # RLS Test Suite — BLOQUEIA MERGE SE FALHAR
  # ============================================================
  test-rls:
    name: RLS Test Suite (CRITICAL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start Supabase local
        run: npx supabase start
      - name: Run RLS test suite
        run: npm run test:rls
      - name: Upload RLS coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rls-coverage
          path: coverage/rls/

  # ============================================================
  # Secret scanning — gitleaks
  # ============================================================
  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Dependency vulnerability scan
  # ============================================================
  audit:
    name: npm audit (vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit (high+critical fail)
        run: npm audit --audit-level=high

  # ============================================================
  # Static analysis — semgrep (regras OWASP + segurança)
  # ============================================================
  semgrep:
    name: Static Analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=p/owasp-top-ten --config=p/typescript --config=p/react --config=p/nextjs
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ============================================================
  # Gate final — tudo precisa passar
  # ============================================================
  ci-gate:
    name: CI Gate (all checks)
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-rls, gitleaks, audit, semgrep]
    steps:
      - run: echo "✅ Todos os checks passaram"
